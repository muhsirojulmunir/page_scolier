name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, xml, ctype, json, tokenizer
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM and Build assets
        run: |
          npm ci
          npm run build

      - name: Create .env file
        run: |
          echo APP_NAME=Scolier > .env
          echo APP_ENV=production >> .env
          echo APP_KEY=${{ secrets.APP_KEY }} >> .env
          echo APP_DEBUG=false >> .env
          echo APP_URL=${{ secrets.APP_URL }} >> .env
          echo LOG_CHANNEL=stack >> .env
          echo LOG_LEVEL=error >> .env

      # ── 1. Upload Laravel Core ke folder /scolier/ ─────────────────────
      - name: Upload Laravel App to /scolier/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 145.79.9.79
          username: u432826049.deployment
          password: ${{ secrets.FTP_DEPLOYMENT_PASSWORD || 'Topsales2026' }}
          port: 21
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/storage/**
            **/public/**
            **/bootstrap/cache/**
            **/.agents/**
            **/.claude/**
            **/.github/**
            **/database/**
            .env.example
            .env.backup
            .env.production.example
            /tests/**
            /phpunit.xml
            /.editorconfig
            /package.json
            /package-lock.json
            /vite.config.js
            README.md
            Thumbs.db

      # ── 2. Upload Public Assets ke folder /public_html/ ────────────────
      - name: Upload Public Assets to /public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 145.79.9.79
          username: u432826049
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./public/
          server-dir: ./
          exclude: |
            index.php
            .htaccess