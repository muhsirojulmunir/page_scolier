name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, xml, ctype, json, tokenizer
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install NPM and Build assets
        run: |
          npm ci
          npm run build

      - name: Create .env file
        run: |
          echo APP_NAME=Scolier > .env
          echo APP_ENV=production >> .env
          echo APP_KEY=${{ secrets.APP_KEY }} >> .env
          echo APP_DEBUG=false >> .env
          echo APP_URL=${{ secrets.APP_URL }} >> .env
          echo LOG_CHANNEL=stack >> .env
          echo LOG_LEVEL=error >> .env

      - name: Deploy files via SCP (SSH)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "app/,bootstrap/,config/,lang/,public/,resources/,routes/,composer.json,composer.lock,artisan,.env"
          target: ${{ secrets.SERVER_PATH }}

      - name: Run composer install and optimize on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            cd ${{ secrets.SERVER_PATH }}
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache