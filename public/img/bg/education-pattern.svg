<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!--
    Motif pendidikan sebagai tekstur latar untuk section berlatar terang.

    Strokenya memakai emas brand (#c4881a), bukan navy. Navy di atas kertas
    hangat terbaca kehitaman dan berbenturan dengan tone halaman; emas menyatu
    sebagai bayangan hangat pada kertas.

    Opasitas sebenarnya diatur dari CSS supaya terbaca sebagai tekstur, bukan
    gambar yang bersaing dengan teks. Ubin 360px dengan motif yang diputar
    bervariasi agar pengulangannya tidak kentara.
  -->
  <g fill="none" stroke="#c4881a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">

    <!-- Buku terbuka -->
    <g transform="translate(28 34)">
      <path d="M0 6c8-5 18-7 27-6v29c-9-1-19 1-27 6z" />
      <path d="M54 6c-8-5-18-7-27-6v29c9-1 19 1 27 6z" />
      <path d="M27 0v29" />
    </g>

    <!-- Topi wisuda -->
    <g transform="translate(196 24) rotate(-8)">
      <path d="M0 12 22 2l22 10-22 10z" />
      <path d="M9 17v11c0 3.6 5.8 6.5 13 6.5s13-2.9 13-6.5V17" />
      <path d="M44 12v13" />
    </g>

    <!-- Bola dunia -->
    <g transform="translate(292 122)">
      <circle cx="20" cy="20" r="20" />
      <path d="M0.6 14h38.8M0.6 26h38.8" />
      <path d="M20 0c6.8 7.6 10.4 15 10.4 20S26.8 32.4 20 40C13.2 32.4 9.6 25 9.6 20S13.2 7.6 20 0z" />
    </g>

    <!-- Obor -->
    <g transform="translate(64 148) rotate(6)">
      <path d="M14 0c2.6 6.2 7 8.6 7 14a7 7 0 0 1-14 0c0-3.8 2.6-6.2 4.4-10" />
      <path d="M6 22h16l-1.4 5H7.4z" />
      <path d="M10 27h8l-2.6 21h-2.8z" />
    </g>

    <!-- Lembar dokumen -->
    <g transform="translate(178 190) rotate(-5)">
      <path d="M0 3a3 3 0 0 1 3-3h20l10 10v27a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3z" />
      <path d="M23 0v7a3 3 0 0 0 3 3h7" />
      <path d="M8 21h17M8 29h11" />
    </g>

    <!-- Pena -->
    <g transform="translate(300 254) rotate(-38)">
      <path d="M6 0h8l3 34-7 12-7-12z" />
      <path d="M6 34h11" />
    </g>

    <!-- Tumpukan buku -->
    <g transform="translate(36 268)">
      <rect x="0" y="20" width="44" height="9" rx="2" />
      <rect x="4" y="10" width="36" height="9" rx="2" />
      <rect x="9" y="0" width="26" height="9" rx="2" />
    </g>

    <!-- Balon percakapan (kelas bahasa) -->
    <g transform="translate(176 296) rotate(4)">
      <path d="M0 8a8 8 0 0 1 8-8h22a8 8 0 0 1 8 8v10a8 8 0 0 1-8 8H14l-9 7v-7a5 5 0 0 1-5-5z" />
      <path d="M9 11h20M9 17h12" />
    </g>

    <!-- Jam (jadwal belajar) -->
    <g transform="translate(272 34)">
      <circle cx="16" cy="16" r="16" />
      <path d="M16 7v9l6 3.6" />
    </g>

  </g>
</svg>
